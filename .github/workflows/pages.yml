name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export the static site
        run: |
          mv app/api /tmp/metryxa-api
          GITHUB_PAGES=1 NEXT_PUBLIC_STATIC_HOST=1 npx next build
          mv /tmp/metryxa-api app/api
          touch out/.nojekyll
          cp CNAME out/CNAME
        env:
          GITHUB_PAGES: "1"
          NEXT_PUBLIC_STATIC_HOST: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
